services:
  web:
    image: web
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    ports:
      - 8000:8000
    depends_on:
      - redis
  celery_worker:
    image: web
    command: celery -A core worker --loglevel=info --pool=solo
    depends_on:
      - redis

  celery_beat:
    image: web
    command: celery -A core.celery beat --loglevel=info
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    container_name: asl_redis
    restart: unless-stopped
