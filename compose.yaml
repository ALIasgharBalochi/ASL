services:
  web:
    image: web
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - .env
    ports:
      - 8000:8000
    depends_on:
      - redis
  db:
    image: postgres:16-alpine
    container_name: asl_db

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    expose:
      - "5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  celery_worker:
    image: web
    command: celery -A core worker --loglevel=info --pool=solo
    depends_on:
      - redis

  celery_beat:
    image: web
    command: celery -A core.celery beat --loglevel=info
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    container_name: asl_redis
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: asl_nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./staticfiles:/app/staticfiles:ro

    depends_on:
      - web
volumes:
  postgres_data:
