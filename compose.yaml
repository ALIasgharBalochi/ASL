services:
  web:
    image: web
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 8000:8000
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    container_name: asl_redis
    restart: unless-stopped
